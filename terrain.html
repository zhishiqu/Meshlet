<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>地层 / 恶地地形</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/src/terrain.css"></head><body>
<div id="viewport"></div><div id="crosshair">+</div>
<header><div class="eyebrow">地层 / 侵蚀实验室</div><h1>穿越恶地。</h1><p>苍白地层。分叉冲沟。破碎岩石。</p><p id="area"></p></header>
<aside>
 <div class="section">RAPTOR 越野车</div>
 <button id="drive" disabled>加载 Raptor 中...</button>
 <div class="buttons"><button id="vehicle-flip" disabled>扶正车辆</button><button id="vehicle-reset" disabled>复位 / R</button></div>
 <button id="vehicle-spawn" disabled>返回山谷起点</button>
 <p id="vehicle-status" class="fine">加载轮组 / 悬挂中...</p>
 <p class="fine">W 油门 · S 刹车 / 倒车 · A D 转向 · 空格 手刹 · V 上下车 · 按住鼠标左键环绕视角</p>
 <div class="section">01 / 地表</div>
 <label>材质检视<select id="surface"><option value="natural">苍白岩石 / 烘焙裂缝</option><option value="sediment">沉积物成分</option><option value="erosion">累计侵蚀</option><option value="deposition">累计沉积</option><option value="wetness">水源 / 持水湿度</option></select></label>
 <label>HLOD 瓦片预算<select id="budget"><option value="96">96 瓦片 / 响应式</option><option value="192">192 瓦片 / 精细</option><option value="384">384 瓦片 / 高精细</option><option value="768" selected>最大 / 768 瓦片</option></select></label>
 <label>Meshlet 细节<select id="lod"><option value="2">自适应 / 2 px</option><option value="0.7">自适应 / 0.7 px</option><option value="0" selected">全驻留细节</option></select></label>
 <label class="check"><input type="checkbox" id="clusters">显示 meshlet 簇</label>
 <details id="lighting-controls"><summary>光照 / 云层</summary>
  <label>云量<input id="cloud-cover" aria-label="云量" type="range" min="0" max="0.85" step="0.01" value="0.52"></label>
  <label>曝光<input id="exposure" aria-label="曝光" type="range" min="0.5" max="2" step="0.05" value="1.00"></label>
  <label class="check"><input id="cloud-pause" type="checkbox">冻结云层</label>
 </details>
 <p id="lighting-status" class="fine">加载烘焙光照中...</p>
 <details id="water-controls"><summary>降雨 / 河流</summary>
  <label>云层下降雨量<input id="rain-rate" aria-label="云层下降雨量" type="range" min="0" max="100" step="5" value="0"></label>
  <label>天气时间<select id="weather-speed"><option value="1">实时</option><option value="10">10 秒 / 秒</option><option value="30" selected>30 秒 / 秒</option><option value="60">最多 1 分钟 / 秒</option></select></label>
  <button id="rain-test">测试 雨→径流→干涸 / 75 秒</button>
  <div class="buttons"><button id="rain-stop">停止降雨</button><button id="water-reset">重置水文</button></div>
  <button id="solver-check">检查流量 / 水量平衡</button>
 </details>
 <p id="water-status" class="fine">地面干燥 / 降雨跟随云层</p>
 <div class="section">02 / 探索</div>
 <button id="camera-mode">行走模式 / F 切换飞行</button>
 <div class="buttons"><button id="overview">全景</button><button id="ridge">山脊</button><button id="ground">地面</button><button id="river">河流</button></div>
 <button id="measure">测量稳定帧时间</button><button id="movement">测试 HLOD 移动 / 220 m</button>
 <p id="status">加载侵蚀烘焙数据中...</p><p id="result"></p><p class="fine" id="provenance"></p>
</aside>
<footer><div><small>潜在三角形</small><strong id="logical">...</strong></div><div><small>驻留 / 已绘制</small><strong id="triangles">...</strong></div><div><small>帧率</small><strong id="fps">...</strong></div><div><small>追踪显存</small><strong id="memory">...</strong></div></footer>
<div class="controls">WASD 驾驶 / 空格 手刹 / V 上下车 / R 复位 / F 行走-飞行 / ESC 释放鼠标</div>
<script type="module" src="/src/terrain.js"></script></body></html>
